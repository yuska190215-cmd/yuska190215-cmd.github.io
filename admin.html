<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — AI Image Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#15111c;
  --bg-soft:#1c1626;
  --surface:#221b2e;
  --surface-2:#2b2338;
  --line:rgba(243,239,231,0.10);
  --line-strong:rgba(243,239,231,0.18);
  --text:#f2ede4;
  --text-dim:#a89bb5;
  --text-faint:#6f6480;
  --gold:#d3aa54;
  --gold-soft:#e8cf98;
  --violet:#8d7ee8;
  --radius:10px;
  --maxw:1200px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
input,textarea,select{font-family:inherit; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--text); padding:8px 12px; border-radius:6px; width:100%; font-size:.9rem;}
input:focus,textarea:focus{outline:none; border-color:var(--gold);}
textarea{resize:vertical; min-height:80px;}
.mono{font-family:'JetBrains Mono',monospace;}
.brand{font-family:'Fraunces',serif; font-size:1.2rem; font-weight:600;}
.brand span{color:var(--gold);}

/* Login */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line-strong); border-radius:16px; padding:36px;}
.login-card h2{font-size:1.5rem; margin-bottom:4px;}
.login-card .sub{color:var(--text-dim); font-size:.85rem; margin-bottom:24px;}
.login-card .field{margin-bottom:16px;}
.login-card .field label{display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:4px;}
.login-error{color:#e8879a; font-size:.82rem; margin-top:10px; display:none;}
.btn-primary{background:linear-gradient(135deg,var(--gold),#b98a3a); color:#1a1420; padding:12px 24px; border-radius:8px; font-weight:600; font-size:.9rem; width:100%;}
.btn-primary:hover{opacity:.9;}

/* Admin shell */
.admin-shell{display:none;}
.admin-topbar{position:sticky; top:0; z-index:50; background:var(--bg-soft); border-bottom:1px solid var(--line); padding:12px 28px; display:flex; justify-content:space-between; align-items:center;}
.admin-topbar .right{display:flex; align-items:center; gap:20px;}
.admin-topbar .right a{color:var(--text-dim); font-size:.8rem;}
.admin-topbar .right a:hover{color:var(--gold-soft);}
.logout-btn{color:var(--text-dim); font-size:.85rem; background:none;}
.logout-btn:hover{color:#e8879a;}

.admin-body{display:flex; min-height:calc(100vh - 60px);}
.admin-side{width:220px; border-right:1px solid var(--line); padding:16px 0; flex-shrink:0; overflow-y:auto;}
.admin-side button{display:block; width:100%; text-align:left; padding:10px 24px; color:var(--text-dim); background:none; font-size:.85rem; border-left:2px solid transparent; transition:all .2s;}
.admin-side button:hover{color:var(--text); background:var(--surface);}
.admin-side button.active{color:var(--gold-soft); border-left-color:var(--gold); background:var(--surface);}

.admin-main{flex:1; padding:28px 36px; max-width:950px; overflow-y:auto; max-height:calc(100vh - 60px);}
.admin-panel{display:none;}
.admin-panel.active{display:block;}
.admin-panel h3{font-family:'Fraunces',serif; font-size:1.4rem; margin-bottom:20px;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:.8rem; color:var(--text-dim); margin-bottom:4px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

.save-btn{background:var(--gold); color:#1a1420; padding:10px 22px; border-radius:8px; font-weight:600; font-size:.85rem;}
.save-btn:hover{background:var(--gold-soft);}
.saved-msg{color:var(--gold-soft); font-size:.82rem; margin-left:12px; opacity:0; transition:opacity .3s;}
.saved-msg.show{opacity:1;}

hr.sep{border:none; border-top:1px solid var(--line); margin:24px 0;}

.add-row-btn{border:1px dashed var(--line-strong); border-radius:8px; padding:10px; color:var(--text-dim); font-size:.85rem; width:100%; text-align:center; background:none;}
.add-row-btn:hover{border-color:var(--gold); color:var(--gold-soft);}

.skill-edit-row{display:grid; grid-template-columns:1fr 90px 40px; gap:10px; align-items:center; margin-bottom:10px;}
.small-x{width:32px; height:32px; border-radius:6px; border:1px solid var(--line-strong); color:var(--text-faint); background:none;}
.small-x:hover{color:#e8879a; border-color:#e8879a;}

.admin-list-item{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:16px;}
.admin-list-item img{width:56px; height:56px; object-fit:cover; border-radius:6px; flex-shrink:0;}
.ali-info{flex:1; min-width:0;}
.ali-info .t{font-weight:600; font-size:.9rem;}
.ali-info .m{font-size:.76rem; color:var(--text-faint);}
.ali-actions{display:flex; gap:8px;}
.ali-actions button{padding:6px 14px; border-radius:6px; font-size:.76rem; border:1px solid var(--line-strong); color:var(--text-dim); background:none;}
.ali-actions button:hover{color:var(--text); border-color:var(--gold);}
.ali-actions .del:hover{color:#e8879a; border-color:#e8879a;}

.image-upload-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.image-preview{width:80px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line-strong);}

.gallery-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.gallery-thumbs img{width:60px; height:60px; object-fit:cover; border-radius:4px; border:1px solid var(--line-strong);}

@media (max-width:768px){
  .admin-body{flex-direction:column;}
  .admin-side{width:100%; display:flex; overflow-x:auto; padding:8px 12px; border-right:none; border-bottom:1px solid var(--line);}
  .admin-side button{width:auto; white-space:nowrap; border-left:none; border-bottom:2px solid transparent;}
  .admin-side button.active{border-left:none; border-bottom-color:var(--gold);}
  .admin-main{padding:20px; max-height:none;}
  .field-row{grid-template-columns:1fr;}
  .skill-edit-row{grid-template-columns:1fr 70px 32px;}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="login-view">
  <div class="login-card">
    <h2>🔐 Вход</h2>
    <p class="sub">Панель управления сайтом</p>
    <div class="field">
      <label>Email</label>
      <input id="login-email" type="email" placeholder="admin@example.com">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="login-password" type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="login-btn">Войти</button>
    <div class="login-error" id="login-error">Неверный email или пароль.</div>
  </div>
</div>

<!-- ============ ADMIN PANEL ============ -->
<div class="admin-shell" id="admin-panel">
  <div class="admin-topbar">
    <div class="brand">admin<span>.</span>panel</div>
    <div class="right">
      <a href="/" target="_blank">Смотреть сайт →</a>
      <button class="logout-btn" id="logout-btn">Выйти</button>
    </div>
  </div>
  <div class="admin-body">
    <div class="admin-side" id="side-nav">
      <button data-panel="hero" class="active">Главная</button>
      <button data-panel="about">Обо мне</button>
      <button data-panel="skills">Навыки</button>
      <button data-panel="projects">Проекты</button>
      <button data-panel="services">Услуги</button>
      <button data-panel="contacts">Контакты</button>
      <button data-panel="messages">Сообщения</button>
    </div>
    <div class="admin-main">

      <!-- HERO -->
      <div class="admin-panel active" id="panel-hero">
        <h3>Главная страница</h3>
        <div class="field"><label>Имя и фамилия</label><input id="f-hero-name"></div>
        <div class="field"><label>Профессия (метка на фото)</label><input id="f-hero-role"></div>
        <div class="field"><label>Статус (надпись в eyebrow)</label><input id="f-hero-status"></div>
        <div class="field"><label>Фото (URL)</label><input id="f-hero-photo"></div>
        <div class="field"><label>Или загрузить фото</label><input id="f-hero-photo-file" type="file" accept="image/*"></div>
        <div class="field"><label>Описание</label><textarea id="f-hero-desc" rows="3"></textarea></div>
        <button class="save-btn" data-save="hero">Сохранить</button><span class="saved-msg" data-saved="hero">Сохранено ✓</span>
      </div>

      <!-- ABOUT -->
      <div class="admin-panel" id="panel-about">
        <h3>Обо мне</h3>
        <div class="field"><label>Фото (URL)</label><input id="f-about-photo"></div>
        <div class="field"><label>Или загрузить фото</label><input id="f-about-photo-file" type="file" accept="image/*"></div>
        <div class="field"><label>Биография</label><textarea id="f-about-bio" rows="4"></textarea></div>
        <div class="field-row">
          <div class="field"><label>Лет опыта</label><input id="f-about-years"></div>
          <div class="field"><label>Проектов выполнено</label><input id="f-about-projects"></div>
        </div>
        <div class="field"><label>Компании (через запятую)</label><input id="f-about-companies"></div>
        <div class="field"><label>Достижения (каждое с новой строки)</label><textarea id="f-about-achv" rows="4"></textarea></div>
        <button class="save-btn" data-save="about">Сохранить</button><span class="saved-msg" data-saved="about">Сохранено ✓</span>
      </div>

      <!-- SKILLS -->
      <div class="admin-panel" id="panel-skills">
        <h3>Навыки</h3>
        <div id="skills-editor"></div>
        <button class="add-row-btn" id="add-skill-btn">+ Добавить навык</button>
        <br><br>
        <button class="save-btn" data-save="skills">Сохранить</button><span class="saved-msg" data-saved="skills">Сохранено ✓</span>
      </div>

      <!-- PROJECTS -->
      <div class="admin-panel" id="panel-projects">
        <h3>Проекты</h3>
        <div id="projects-list"></div>
        <hr class="sep">
        <h4 id="project-form-title" style="font-size:1.1rem;">Добавить проект</h4>
        <input type="hidden" id="f-proj-id">
        <div class="field-row">
          <div class="field"><label>Название</label><input id="f-proj-title"></div>
          <div class="field"><label>Категория</label><input id="f-proj-cat"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Дата</label><input id="f-proj-date" placeholder="Март 2026"></div>
          <div class="field"><label>Клиент</label><input id="f-proj-client"></div>
        </div>
        <div class="field"><label>Главное изображение (URL)</label><input id="f-proj-img"></div>
        <div class="field"><label>Или загрузить изображение</label><input id="f-proj-img-file" type="file" accept="image/*"></div>
        <div class="field"><label>Галерея (URL через запятую)</label><input id="f-proj-gallery"></div>
        <div class="field"><label>Или загрузить несколько изображений</label><input id="f-proj-gallery-file" type="file" accept="image/*" multiple></div>
        <div class="field"><label>Цель проекта</label><input id="f-proj-goal"></div>
        <div class="field"><label>Что изображено</label><input id="f-proj-subject"></div>
        <div class="field"><label>Описание</label><textarea id="f-proj-desc" rows="3"></textarea></div>
        <div class="field"><label>Инструменты (через запятую)</label><input id="f-proj-tools"></div>
        <button class="save-btn" id="save-project-btn">Сохранить проект</button>
        <button id="cancel-edit-btn" style="margin-left:10px; color:var(--text-dim); background:none;">Отменить</button>
        <span class="saved-msg" data-saved="projects">Сохранено ✓</span>
      </div>

      <!-- SERVICES -->
      <div class="admin-panel" id="panel-services">
        <h3>Услуги</h3>
        <div id="services-editor"></div>
        <button class="add-row-btn" id="add-service-btn">+ Добавить услугу</button>
        <br><br>
        <button class="save-btn" data-save="services">Сохранить</button><span class="saved-msg" data-saved="services">Сохранено ✓</span>
      </div>

      <!-- CONTACTS -->
      <div class="admin-panel" id="panel-contacts">
        <h3>Контакты</h3>
        <div class="field"><label>Email</label><input id="f-contact-email"></div>
        <div class="field"><label>Telegram</label><input id="f-contact-telegram"></div>
        <div class="field"><label>Instagram</label><input id="f-contact-instagram"></div>
        <div class="field"><label>LinkedIn</label><input id="f-contact-linkedin"></div>
        <div class="field"><label>Behance</label><input id="f-contact-behance"></div>
        <button class="save-btn" data-save="contacts">Сохранить</button><span class="saved-msg" data-saved="contacts">Сохранено ✓</span>
      </div>

      <!-- MESSAGES -->
      <div class="admin-panel" id="panel-messages">
        <h3>Сообщения</h3>
        <div id="messages-list">
          <p style="color:var(--text-faint);">Загрузка...</p>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* =====================================================
   CONFIGURATION — замените на свои данные Supabase
   ===================================================== */
const SUPABASE_URL = 'https://plhuigyozjgmhcuzkosw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsaHVpZ3lvempnbWhjdXprb3N3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTU0MTAsImV4cCI6MjEwMTMzMTQxMH0.qojhqwH0zCCR5ff6sA9ybaYyMMxb1lpPvedxdq9ZK_Y';

// Используем другое имя переменной, чтобы избежать конфликта с глобальной
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================
   STATE
   ===================================================== */
let currentUser = null;
let editingProjectId = null;
let DATA = {};

/* =====================================================
   AUTH
   ===================================================== */
async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    showAdminPanel();
  } else {
    showLogin();
  }
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value.trim();
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  currentUser = data.user;
  showAdminPanel();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  currentUser = null;
  showLogin();
});

function showLogin() {
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('admin-panel').style.display = 'none';
}

function showAdminPanel() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  loadAllData();
}

/* =====================================================
   LOAD DATA
   ===================================================== */
async function loadAllData() {
  const { data: hero } = await supabaseClient.from('site_hero').select('*').single();
  const { data: about } = await supabaseClient.from('site_about').select('*').single();
  const { data: skills } = await supabaseClient.from('site_skills').select('*');
  const { data: services } = await supabaseClient.from('site_services').select('*');
  const { data: contacts } = await supabaseClient.from('site_contacts').select('*').single();
  const { data: projects } = await supabaseClient.from('site_projects').select('*').order('date', { ascending: false });
  const { data: messages } = await supabaseClient.from('site_messages').select('*').order('created_at', { ascending: false });

  DATA = { hero, about, skills, services, contacts, projects, messages };
  
  populateForms();
  renderSkillsEditor();
  renderServicesEditor();
  renderProjectsList();
  renderMessages();
}

/* =====================================================
   POPULATE FORMS
   ===================================================== */
function populateForms() {
  const h = DATA.hero || {};
  document.getElementById('f-hero-name').value = h.name || '';
  document.getElementById('f-hero-role').value = h.role || '';
  document.getElementById('f-hero-status').value = h.status || '';
  document.getElementById('f-hero-photo').value = h.photo || '';
  document.getElementById('f-hero-desc').value = h.desc || '';

  const a = DATA.about || {};
  document.getElementById('f-about-photo').value = a.photo || '';
  document.getElementById('f-about-bio').value = a.bio || '';
  document.getElementById('f-about-years').value = a.years || '';
  document.getElementById('f-about-projects').value = a.projects || '';
  document.getElementById('f-about-companies').value = a.companies || '';
  document.getElementById('f-about-achv').value = a.achv || '';

  const c = DATA.contacts || {};
  document.getElementById('f-contact-email').value = c.email || '';
  document.getElementById('f-contact-telegram').value = c.telegram || '';
  document.getElementById('f-contact-instagram').value = c.instagram || '';
  document.getElementById('f-contact-linkedin').value = c.linkedin || '';
  document.getElementById('f-contact-behance').value = c.behance || '';
}

/* =====================================================
   SKILLS EDITOR
   ===================================================== */
function renderSkillsEditor() {
  const wrap = document.getElementById('skills-editor');
  const skills = DATA.skills || [];
  wrap.innerHTML = skills.map((s, i) => `
    <div class="skill-edit-row" data-i="${i}">
      <input class="sk-name" value="${s.name}" placeholder="Название">
      <input class="sk-pct" value="${s.pct}" placeholder="%" type="number" min="0" max="100">
      <button class="small-x remove-skill">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.remove-skill').forEach(b => {
    b.addEventListener('click', e => e.target.closest('.skill-edit-row').remove());
  });
}

document.getElementById('add-skill-btn').addEventListener('click', () => {
  const wrap = document.getElementById('skills-editor');
  const div = document.createElement('div');
  div.className = 'skill-edit-row';
  div.innerHTML = `<input class="sk-name" placeholder="Название"><input class="sk-pct" placeholder="%" type="number" min="0" max="100"><button class="small-x remove-skill">✕</button>`;
  div.querySelector('.remove-skill').addEventListener('click', () => div.remove());
  wrap.appendChild(div);
});

function collectSkills() {
  return [...document.querySelectorAll('#skills-editor .skill-edit-row')]
    .map(row => ({
      name: row.querySelector('.sk-name').value.trim(),
      pct: Math.min(100, Math.max(0, parseInt(row.querySelector('.sk-pct').value) || 0))
    }))
    .filter(s => s.name);
}

/* =====================================================
   SERVICES EDITOR
   ===================================================== */
function renderServicesEditor() {
  const wrap = document.getElementById('services-editor');
  const services = DATA.services || [];
  wrap.innerHTML = services.map((s, i) => `
    <div class="skill-edit-row" style="grid-template-columns:1fr 1fr 40px;" data-i="${i}">
      <input class="sv-title" value="${s.title}" placeholder="Название">
      <input class="sv-desc" value="${s.desc}" placeholder="Описание">
      <button class="small-x remove-service">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('.remove-service').forEach(b => {
    b.addEventListener('click', e => e.target.closest('.skill-edit-row').remove());
  });
}

document.getElementById('add-service-btn').addEventListener('click', () => {
  const wrap = document.getElementById('services-editor');
  const div = document.createElement('div');
  div.className = 'skill-edit-row';
  div.style.gridTemplateColumns = '1fr 1fr 40px';
  div.innerHTML = `<input class="sv-title" placeholder="Название"><input class="sv-desc" placeholder="Описание"><button class="small-x remove-service">✕</button>`;
  div.querySelector('.remove-service').addEventListener('click', () => div.remove());
  wrap.appendChild(div);
});

function collectServices() {
  return [...document.querySelectorAll('#services-editor .skill-edit-row')]
    .map(row => ({
      title: row.querySelector('.sv-title').value.trim(),
      desc: row.querySelector('.sv-desc').value.trim()
    }))
    .filter(s => s.title);
}

/* =====================================================
   PROJECTS
   ===================================================== */
function renderProjectsList() {
  const wrap = document.getElementById('projects-list');
  const projects = DATA.projects || [];
  if (!projects.length) {
    wrap.innerHTML = '<p style="color:var(--text-faint);">Проектов пока нет.</p>';
    return;
  }
  wrap.innerHTML = projects.map(p => `
    <div class="admin-list-item">
      <img src="${p.image || ''}">
      <div class="ali-info"><div class="t">${p.title}</div><div class="m">${p.category} · ${p.date}</div></div>
      <div class="ali-actions">
        <button class="edit-proj" data-id="${p.id}">Изменить</button>
        <button class="del del-proj" data-id="${p.id}">Удалить</button>
      </div>
    </div>
  `).join('');
  wrap.querySelectorAll('.edit-proj').forEach(b => b.addEventListener('click', () => loadProjectForEdit(b.dataset.id)));
  wrap.querySelectorAll('.del-proj').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Удалить проект?')) return;
    await supabaseClient.from('site_projects').delete().eq('id', b.dataset.id);
    await loadAllData();
  }));
}

function resetProjectForm() {
  editingProjectId = null;
  document.getElementById('project-form-title').textContent = 'Добавить проект';
  ['f-proj-id','f-proj-title','f-proj-cat','f-proj-date','f-proj-client','f-proj-img','f-proj-gallery','f-proj-goal','f-proj-subject','f-proj-desc','f-proj-tools'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('save-project-btn').textContent = 'Сохранить проект';
}

function loadProjectForEdit(id) {
  const p = (DATA.projects || []).find(x => x.id === id);
  if (!p) return;
  editingProjectId = id;
  document.getElementById('project-form-title').textContent = 'Редактировать проект';
  document.getElementById('f-proj-id').value = p.id;
  document.getElementById('f-proj-title').value = p.title || '';
  document.getElementById('f-proj-cat').value = p.category || '';
  document.getElementById('f-proj-date').value = p.date || '';
  document.getElementById('f-proj-client').value = p.client || '';
  document.getElementById('f-proj-img').value = p.image || '';
  document.getElementById('f-proj-gallery').value = (p.gallery || []).join(', ');
  document.getElementById('f-proj-goal').value = p.goal || '';
  document.getElementById('f-proj-subject').value = p.subject || '';
  document.getElementById('f-proj-desc').value = p.desc || '';
  document.getElementById('f-proj-tools').value = (p.tools || []).join(', ');
  document.getElementById('save-project-btn').textContent = 'Обновить проект';
  document.getElementById('panel-projects').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('cancel-edit-btn').addEventListener('click', resetProjectForm);

function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

document.getElementById('save-project-btn').addEventListener('click', async () => {
  const title = document.getElementById('f-proj-title').value.trim();
  if (!title) { alert('Укажите название проекта'); return; }

  let image = document.getElementById('f-proj-img').value.trim();
  const imgFile = document.getElementById('f-proj-img-file').files[0];
  if (imgFile) image = await fileToDataUrl(imgFile);

  let gallery = document.getElementById('f-proj-gallery').value.split(',').map(s => s.trim()).filter(Boolean);
  const galleryFiles = document.getElementById('f-proj-gallery-file').files;
  if (galleryFiles.length) {
    const dataUrls = await Promise.all([...galleryFiles].map(fileToDataUrl));
    gallery = gallery.concat(dataUrls);
  }

  const proj = {
    id: editingProjectId || 'p' + Date.now(),
    title,
    category: document.getElementById('f-proj-cat').value.trim() || 'Проект',
    date: document.getElementById('f-proj-date').value.trim(),
    client: document.getElementById('f-proj-client').value.trim(),
    image: image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1000&q=80',
    gallery,
    goal: document.getElementById('f-proj-goal').value.trim(),
    subject: document.getElementById('f-proj-subject').value.trim(),
    desc: document.getElementById('f-proj-desc').value.trim(),
    tools: document.getElementById('f-proj-tools').value.split(',').map(s => s.trim()).filter(Boolean)
  };

  if (editingProjectId) {
    await supabaseClient.from('site_projects').update(proj).eq('id', editingProjectId);
  } else {
    await supabaseClient.from('site_projects').insert(proj);
  }
  resetProjectForm();
  await loadAllData();
  flashSaved('projects');
});

/* =====================================================
   MESSAGES
   ===================================================== */
function renderMessages() {
  const wrap = document.getElementById('messages-list');
  const msgs = DATA.messages || [];
  if (!msgs.length) {
    wrap.innerHTML = '<p style="color:var(--text-faint);">Нет сообщений.</p>';
    return;
  }
  wrap.innerHTML = msgs.map(m => `
    <div class="admin-list-item" style="flex-direction:column; align-items:stretch;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong>${m.name}</strong> <span style="color:var(--text-faint); font-size:.8rem;">${m.email}</span></div>
        <span style="font-size:.7rem; color:var(--text-faint);">${new Date(m.created_at).toLocaleString()}</span>
      </div>
      <p style="color:var(--text-dim); font-size:.9rem; margin-top:4px;">${m.message}</p>
    </div>
  `).join('');
}

/* =====================================================
   SAVE HANDLERS
   ===================================================== */
function flashSaved(key) {
  const el = document.querySelector(`[data-saved="${key}"]`);
  if (!el) return;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

document.querySelectorAll('[data-save]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const key = btn.dataset.save;

    if (key === 'hero') {
      const data = {
        name: document.getElementById('f-hero-name').value,
        role: document.getElementById('f-hero-role').value,
        status: document.getElementById('f-hero-status').value,
        photo: document.getElementById('f-hero-photo').value,
        desc: document.getElementById('f-hero-desc').value
      };
      const file = document.getElementById('f-hero-photo-file').files[0];
      if (file) data.photo = await fileToDataUrl(file);
      await supabaseClient.from('site_hero').upsert(data);
    }

    if (key === 'about') {
      const data = {
        photo: document.getElementById('f-about-photo').value,
        bio: document.getElementById('f-about-bio').value,
        years: document.getElementById('f-about-years').value,
        projects: document.getElementById('f-about-projects').value,
        companies: document.getElementById('f-about-companies').value,
        achv: document.getElementById('f-about-achv').value
      };
      const file = document.getElementById('f-about-photo-file').files[0];
      if (file) data.photo = await fileToDataUrl(file);
      await supabaseClient.from('site_about').upsert(data);
    }

    if (key === 'skills') {
      const skills = collectSkills();
      await supabaseClient.from('site_skills').delete().neq('id', '000');
      if (skills.length) await supabaseClient.from('site_skills').insert(skills);
    }

    if (key === 'services') {
      const services = collectServices();
      await supabaseClient.from('site_services').delete().neq('id', '000');
      if (services.length) await supabaseClient.from('site_services').insert(services);
    }

    if (key === 'contacts') {
      const data = {
        email: document.getElementById('f-contact-email').value,
        telegram: document.getElementById('f-contact-telegram').value,
        instagram: document.getElementById('f-contact-instagram').value,
        linkedin: document.getElementById('f-contact-linkedin').value,
        behance: document.getElementById('f-contact-behance').value
      };
      await supabaseClient.from('site_contacts').upsert(data);
    }

    await loadAllData();
    flashSaved(key);
  });
});

/* =====================================================
   SIDE NAV
   ===================================================== */
document.querySelectorAll('#side-nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#side-nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
  });
});

/* =====================================================
   BOOT
   ===================================================== */
checkAuth();
</script>
